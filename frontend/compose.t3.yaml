# Overlay T3 sobre los Compose existentes de T1 y T2, sin modificarlos.
services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: runtime
    environment:
      VITE_GATEWAY_URL: http://gateway:8080
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-5173}:8080"
    depends_on:
      gateway:
        condition: service_started
