name: Motor de equivalencia — HU-14 T9 y T10
on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/homologacion-service/**'
      - 'tests/Homologacion.*.Tests/**'
      - 'tests/homologacion-service/**'
      - 'tests/sprint-1/**'
      - 'compose.sprint1.yaml'
      - 'src/gateway/**'
      - 'Homologacion.sln'
      - '.github/workflows/homologacion-service.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/sprint-1 -p 'test_*.py' -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Homologacion.sln
      - run: dotnet build Homologacion.sln --configuration Release --no-restore
      - run: dotnet test Homologacion.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homologacion-test-results
          path: TestResults/*.trx
