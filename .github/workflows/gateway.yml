name: Gateway YARP — HU-01 T2
on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/gateway/**'
      - 'tests/Gateway.Tests/**'
      - 'tests/gateway/**'
      - 'src/auth-service/**'
      - 'Homologacion.sln'
      - '.github/workflows/gateway.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Homologacion.sln
      - run: dotnet build Homologacion.sln --configuration Release --no-restore
      - run: dotnet test Homologacion.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-test-results
          path: TestResults/*.trx
