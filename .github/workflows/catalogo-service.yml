name: catalogo-service
on:
  push:
    paths: ['src/catalogo-service/**', 'tests/Catalogo.Tests/**', '.github/workflows/catalogo-service.yml']
  pull_request:
    paths: ['src/catalogo-service/**', 'tests/Catalogo.Tests/**', '.github/workflows/catalogo-service.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/catalogo-service/Catalogo.sln
      - run: dotnet build src/catalogo-service/Catalogo.sln --no-restore -c Release
      - run: dotnet test src/catalogo-service/Catalogo.sln --no-restore --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogo-tests
          path: TestResults
