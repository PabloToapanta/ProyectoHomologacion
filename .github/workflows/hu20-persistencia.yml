name: HU-20 persistencia del análisis
on:
  push:
    paths: ['src/homologacion-service/**', 'tests/Homologacion.Infrastructure.Tests/**', '.github/workflows/hu20-persistencia.yml']
  pull_request:
    paths: ['src/homologacion-service/**', 'tests/Homologacion.Infrastructure.Tests/**', '.github/workflows/hu20-persistencia.yml']
permissions:
  contents: read
jobs:
  sql-server:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          # Credencial sintética y efímera exclusiva del contenedor de CI.
          MSSQL_SA_PASSWORD: 'Hu20-CI-Sql_2026!'
        ports: ['1433:1433']
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Hu20-CI-Sql_2026!' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval=10s --health-timeout=5s --health-retries=30 --health-start-period=20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/Homologacion.Infrastructure.Tests/Homologacion.Infrastructure.Tests.csproj -c Release --logger trx --results-directory TestResults
        env:
          HU20_TEST_SQL: 'Server=localhost,1433;User Id=sa;Password=Hu20-CI-Sql_2026!;Encrypt=True;TrustServerCertificate=True'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hu20-persistencia-tests
          path: TestResults
